<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Example</title>
</head>
<body>
    <!----heading diye --->
    
  <h2>Login Form</h2>

  <!-- Form Start -->
  <form action="submit.php" method="POST">
    <!-- label ke sath id,name,value doge toh label work karega fully -->
    <!-- Username Field -->
    <label for="username">username</label>
    Username: 
    <input type="text" id="username" placeholder="Enter Username" value="Guest"><br><br>
    
    <!-- Password Field -->
    Password: 
    <input type="password" name="password" placeholder="Enter Password"><br><br>
    
    <!-- Submit Button -->
    <input type="submit" value="Login">

  </form>
</body>
</html>
