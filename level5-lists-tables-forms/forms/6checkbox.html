<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox</title>
</head>
<body>
    <!--"label" de rahe ho toh input mai sab kuch define karo type,id,name,value--->
    <!----Testing input type checkbox--->
    <form>
        <label for="Apple">Apple</label>
        <input type="checkbox" id="Apple" name="fruit" value="Apple"><br>

        <label for="Banana">Banana</label>
        <input type="checkbox" id="Banana" name="fruit" value="Banana"><br>

        <label for="cherry">cherry</label>
        <input type="checkbox" id="cherry" name="fruit" value="cherry"><br>
    </form>
    <hr> <!----Testing inpute type select--->
    <form>
        <label for="fruits">fruits</label>
        <select name="fruits" id="fruits">
            <option value="Apple">apple</option>
        <option value="Banana">Banana</option>
        <option value="cherry">cherry</option>
        </select>
    </form><hr>
    <!----Testing inpute type textarea
    with countaing 4 row  30 column & (can be resizable) --->
    <form>
        <textarea name="feedback" rows="4" cols="30" placeholder="Enter feedback"></textarea>

    </form>
</body>
</html>
