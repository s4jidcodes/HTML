<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Action Attribute Example</title>
</head>
<body>
  <h2>Simple Login Form</h2>

  <!-- 
    action: Yeh batata hai ki form ka data kahan bhejna hai
    method: GET ya POST (GET data URL me dikhata hai, POST hidden bhejta hai)
  -->
    <!----niche dummy link hai (process..)--->
  <form action="process.php" method="POST">
    
    <!-- "name" important hai kyunki server is key se data read karega -->
    Username: <input type="text" name="username" placeholder="Enter username"><br><br>
    
    Password: <input type="password" name="password" placeholder="Enter password"><br><br>
    
    <!-- Submit button data bhejne ke liye -->
    <input type="submit" value="Login">
  </form>

</body>
</html>
